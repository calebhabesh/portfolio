<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <filter id="chalk" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".65 .9" numOctaves="3" seed="29" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues="0 .12 .35 .78 .95 1 1"/>
      <feFuncG type="discrete" tableValues="0 .12 .35 .78 .95 1 1"/>
      <feFuncB type="discrete" tableValues="0 .12 .35 .78 .95 1 1"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
  </filter>
  <rect width="64" height="64" fill="white" filter="url(#chalk)"/>
</svg>
