name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Quick browser test
        run: npm run test:quick
        env:
          # The runner image ships Google Chrome; playwright-core uses it directly.
          CHROMIUM_PATH: /usr/bin/google-chrome

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quick-test-failures
          path: .artifacts/quick-failure-*.png
          if-no-files-found: ignore
